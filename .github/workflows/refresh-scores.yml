name: Refresh FPL scores

# Every 10 minutes GitHub wakes this job; it only calls the FPL API while a
# match is on (plus an hourly check until FPL confirms a gameweek's final
# points, and a daily fixture check). When the scores change it commits the
# new data to main and republishes the site to gh-pages.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even if no match is on"
        type: boolean
        default: true
      test_email:
        description: "Send me a test email (to EMAILS_TEST_TO)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is a match on?
        id: due
        run: |
          out=$(python build_data.py fpl-due)
          echo "$out"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "${out%% *}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch from FPL and rebuild
        if: steps.due.outputs.due == 'true'
        run: python build_data.py fpl

      - name: Commit and publish if scores changed
        if: steps.due.outputs.due == 'true'
        run: |
          if git diff --quiet -- web/data; then
            echo "No score changes."
            # a manual run always republishes, so site changes merged to main go live
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          else
            git config user.name "spin-xi-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/data web/img data/raw/2627
            git commit -q -m "Live FPL score refresh"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
          # publish web/ as the gh-pages branch (same as deploy.bat)
          cd web
          git init -q -b gh-pages
          git add -A
          git -c user.name="spin-xi-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish $(git -C .. rev-parse --short HEAD)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published."

      # re-spin reminders and gameweek results for players who opted in
      # (mailer.py). Needs the FIREBASE_SERVICE_ACCOUNT and SMTP_* secrets;
      # until EMAILS_LIVE is "true" only EMAILS_TEST_TO gets anything.
      - name: Anything to email?
        id: mail
        if: ${{ !cancelled() }}
        env:
          SET_UP: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.SMTP_PASSWORD != '' }}
        run: |
          if [ "$SET_UP" != "true" ]; then echo "Emails aren't set up yet."; exit 0; fi
          if [ "${{ inputs.test_email }}" = "true" ]; then
            echo "due=test" >> "$GITHUB_OUTPUT"; exit 0
          fi
          out=$(python mailer.py due)
          echo "$out"
          echo "${out%% *}" >> "$GITHUB_OUTPUT"

      - name: Send emails
        if: ${{ !cancelled() && (steps.mail.outputs.due == 'true' || steps.mail.outputs.due == 'test') }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          EMAILS_LIVE: ${{ vars.EMAILS_LIVE }}
          EMAILS_TEST_TO: ${{ vars.EMAILS_TEST_TO }}
        run: |
          if [ "${{ steps.mail.outputs.due }}" = "test" ]; then python mailer.py test; exit 0; fi
          pip install -q "firebase-admin>=7,<8"
          python mailer.py run
