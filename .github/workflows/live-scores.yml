name: Live match scores

# GitHub runs scheduled jobs late or skips them when it's busy (on match day
# the 10-minute "Refresh FPL scores" schedule only fired every ~4 hours), so
# this job doesn't rely on frequent ticks. Whichever tick lands first stays
# alive for up to ~6 hours and refreshes every 5 minutes through each match
# window, then hands over to a fresh run while matches keep coming.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # lets a run start its successor

# one live run at a time; extra ticks wait and exit quickly if nothing's on
concurrency:
  group: live-scores
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh every 5 minutes while matches are on
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKAHEAD_MIN: 360      # stay alive if a match starts within 6 hours
          CHAIN_MIN: 720          # hand over to a new run if one starts within 12 hours
          BUDGET_MIN: 340         # stop before the job's 6-hour limit
        run: |
          git config --global user.name "spin-xi-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stop=$((SECONDS + BUDGET_MIN * 60))
          while :; do
            # start each pass from the latest main so publishing never rolls
            # back site changes merged while this run is alive
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq -- web data

            next=$(python build_data.py fpl-next)
            left=$(( (stop - SECONDS) / 60 ))
            echo "$(date -u +%H:%M) next match window in: $next min, budget left: $left min"
            if [ "$next" = "none" ] || [ "$next" -gt "$LOOKAHEAD_MIN" ]; then
              echo "No match within $LOOKAHEAD_MIN minutes, stopping."
              break
            fi
            if [ "$left" -le 5 ]; then
              if [ "$next" -le "$CHAIN_MIN" ]; then
                echo "Out of time with matches still to come, starting a new run."
                gh workflow run live-scores.yml --ref main -R "${{ github.repository }}"
              fi
              break
            fi

            if [ "$next" = "0" ]; then
              python build_data.py fpl || { echo "FPL fetch failed, retrying next pass"; sleep 300; continue; }
              if git diff --quiet -- web/data; then
                echo "No score changes."
              else
                git add web/data web/img data/raw/2627
                git commit -q -m "Live FPL score refresh"
                if ! { git pull -q --rebase origin main && git push -q origin HEAD:main; }; then
                  echo "Push to main failed, retrying next pass"; sleep 60; continue
                fi
                # publish web/ as the gh-pages branch (same as deploy.bat)
                rm -rf /tmp/site && cp -r web /tmp/site
                (
                  cd /tmp/site
                  git init -q -b gh-pages
                  git add -A
                  git commit -q -m "Publish $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
                  git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
                )
                echo "Published."
              fi
              sleep 300
            else
              # sleep until the window opens, waking at least every 30 min to pick up new main
              nap=$(( next < 30 ? next : 30 ))
              sleep $(( (nap > 0 ? nap : 1) * 60 ))
            fi
          done
