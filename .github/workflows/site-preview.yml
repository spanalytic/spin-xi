name: Site preview

# Branch-only helper for the redesign: checks which Premier League image
# URLs work from GitHub (the dev container can't reach them).
on:
  push:
    branches: ["claude/site-redesign-*"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe image URLs
        run: python tools/probe_images.py probe.json
      - name: Save club badges and check player photos
        run: |
          python build_data.py fpl-assets
          git config user.name "spin-xi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img/badges data/raw/2627/photos.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Club badges and player photo check"
            git push -q origin HEAD:${{ github.ref_name }}
          fi
