name: Site preview

# Branch-only helper for the redesign: saves club badges and takes
# screenshots with real photos (the dev container can't reach the
# Premier League image servers).
on:
  push:
    branches: ["claude/site-redesign-*"]
    paths-ignore: ["preview/**"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Save club badges and check player photos
        run: python build_data.py fpl-assets
      - name: Screenshots
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 8317 --directory web >/dev/null 2>&1 &
          sleep 1
          rm -rf preview
          node tools/screenshots.mjs http://localhost:8317/ preview
      - name: Commit
        run: |
          git config user.name "spin-xi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img/badges data/raw/2627/photos.json preview
          if ! git diff --cached --quiet; then
            git commit -q -m "Preview screenshots"
            git push -q origin HEAD:${{ github.ref_name }}
          fi
